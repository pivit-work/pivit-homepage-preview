const SQUADS = [{"color": "#4F6AF5"}, {"color": "#8B5CF6"}, {"color": "#F59E0B"}, {"color": "#22C55E"}];

const ORG_MEMBER_SORT = "job_level";
const orgMemberRank = (p, key) => {

const orgMemberCompare = (unit, key = ORG_MEMBER_SORT) => {

const orgInitialCollapsed = (node, depth = 0, acc = new Set()) => {

const ORG_HGAP = 20, ORG_VGAP = 56;

const ORG_CARD_SHADOW = "rgba(10,13,18,.1) 0 1px 3px 0", ORG_CARD_RADIUS = 12;
const ORG_P = () => window.PIVIT;
const orgConnectorPath = (pct, style) => (style === "ortho" ? `M 50 0 V 50 H ${pct} V 100` : `M 50 0 C 50 50, ${pct} 50, ${pct} 100`);

    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{ position: "absolute", top: -ORG_VGAP, left: 0, right: 0, width: "100%", height: ORG_VGAP, overflow: "visible", pointerEvents: "none" }}>

const OrgFreeDragCtx = React.createContext(null);
const orgDragStyle = (drag, id) => { const o = drag?.offsets[id]; return o && (o.x || o.y) ? { transform: `translate(${o.x}px, ${o.y}px)` } : null; };

function OrgChildRow({ lineStyle = "curve", marginTop = ORG_VGAP, children }) {

    const row = ref.current; if (!row) return;

    const rr = row.getBoundingClientRect(); const k = rr.width ? row.offsetWidth / rr.width : 1;
    const cx = (el) => { const r = el.getBoundingClientRect(); return Math.round((r.left + r.width / 2 - rr.left) * k); };

            <polygon points={isoPts([[g0, g0, 0], [gx1, g0, 0], [gx1, gy1, 0], [g0, gy1, 0]])} style={{ fill: P.color.bgSection }} />
            {gridLines.map((ln, i) => <polyline key={`gl${i}`} points={isoPts(ln)} style={{ fill: "none", stroke: P.color.borderLight, strokeWidth: 1 }} />)}
            {data.teams.map((tm, ti) => slab(TL.slabs[ti], `t-${tm.id}`, up === "org", famOf(tm.family).color, null))}
            {data.squads.map((sq, si) => slab(SL.slabs[si], `s-${sq.id}`, up === "squad", sq.color, famCount(sq.members)))}
            {none.length > 0 && slab(SL.slabs[data.squads.length], "s-none", up === "squad", null, null, true)}
            {data.teams.map((tm, ti) => { const hd = teamMembers[ti].map(m => personOf(m.pid)).find(p => p && p.head);
              return label(TL.slabs[ti], `t-${tm.id}`, up === "org", tm.name, "팀장", hd && hd.name, `${teamMembers[ti].length}명 · ${famOf(tm.family).label}`, isoMix(famOf(tm.family).color, 70)); })}
            {data.squads.map((sq, si) => { const ld = personOf((sq.members.find(m => m.lead) || {}).pid);
              return label(SL.slabs[si], `s-${sq.id}`, up === "squad", sq.name, "리드", ld && ld.name, `${sq.members.length}명 · ${famCount(sq.members).length}개 직군`, sq.color); })}
            {none.length > 0 && label(SL.slabs[data.squads.length], "s-none", up === "squad", "스쿼드 없음", null, null, `${none.length}명`, null)}
            {phase === "play" && drawn.map(tk => { const [gx, gy] = isoP(tk.A.x, tk.A.y, 0); return (
              <ellipse key={`sh-${tk.key}`} ref={el => { shadows.current[tk.key] = el; }} cx={0} cy={0} rx={cs * 0.8} ry={cs * 0.42} opacity={0}
                transform={`translate(${gx.toFixed(1)} ${gy.toFixed(1)})`} style={{ fill: "rgba(10,13,18,.14)" }} />
            ); })}
            {drawn.map(tk => {
              if (phase === "done" && to === "org" && tk.dup) return null;
              const at = phase === "done" ? tk.B : tk.A;
              const [sx, sy] = isoP(at.x, at.y, 0);
              const c = famOf(tk.p.family).color;
              const isHead = onSquadFloor ? tk.lead : tk.p.head;
              const f = isHead ? tall : faces, bh = isHead ? chh * 1.7 : chh;
              const dim = hov ? (tk.pid === hov ? 1 : 0.2) : (tk.none && onSquadFloor ? 0.5 : 1);
              const team = teamOf(tk.p.teamId);
              const role = isHead ? (onSquadFloor ? "리드" : "팀장") : "";
              const line2 = onSquadFloor ? (team ? team.name : "") : (tk.p.title || (team ? team.name : ""));
              const cy = -bh - h2 - 9 - CH;
              return (
                <g key={tk.key} data-iso-cube={tk.key} ref={el => { nodes.current[tk.key] = el; }} transform={`translate(${sx.toFixed(1)} ${sy.toFixed(1)})`}
                  opacity={dim} onMouseEnter={() => phase === "done" && setHov(tk.pid)} onMouseLeave={() => setHov(null)}
                  onClick={() => { if (drag.current && drag.current.moved) return; tk.p.om && onOpenCard(tk.p.om); }}
                  style={{ cursor: tk.p.om ? "pointer" : "inherit", transition: "opacity 200ms" }}>
                  <title>{`${tk.p.name}${role ? ` · ${role}` : ""} · ${tk.p.title ? `${tk.p.title} · ` : ""}${team ? team.name : ""}${tk.none ? " · 스쿼드 없음" : ""}`}</title>
                  <polygon points={f.front} style={{ fill: isoMix(c, 55) }} />
                  <polygon points={f.side} style={{ fill: isoMix(c, 78) }} />
                  <polygon points={f.top} style={{ fill: isoMix(c, 24) }} />
                  <g data-iso-tag>
                    <path d={`M -6 ${cy + CH - 1} L 0 ${cy + CH + 7} L 6 ${cy + CH - 1} Z`} style={{ fill: P.color.card, stroke: hov === tk.pid ? P.color.borderBrand : P.color.borderLight, strokeWidth: 1 }} />
                    <rect x={-CW / 2} y={cy} width={CW} height={CH} rx={6} style={{ fill: P.color.card, stroke: hov === tk.pid ? P.color.borderBrand : P.color.borderLight, strokeWidth: 1 }} />
                    <rect x={-5} y={cy + CH - 2} width={10} height={3} style={{ fill: P.color.card }} />
                    <rect x={-CW / 2} y={cy} width={3} height={CH} rx={1.5} style={{ fill: isoMix(c, 70) }} />
                    <text x={-CW / 2 + 9} y={cy + 14} style={{ fontSize: 12, fontWeight: 700, fill: P.color.strong, fontFamily: T.font }}>
                      {isHead && <tspan style={{ fill: P.color.star }}>★</tspan>}{isoFit(tk.p.name, CW - (isHead ? 50 : 14), 12)}
                      {isHead && <tspan style={{ fontSize: 11, fontWeight: 600, fill: P.color.brandDeep }}>{` · ${role}`}</tspan>}
                    </text>
                    <text x={-CW / 2 + 9} y={cy + 28} style={{ fontSize: 11, fontWeight: 500, fill: P.color.sub, fontFamily: T.font }}>
                      {isoFit(line2, CW - 14, 11)}
                    </text>
                  </g>
                </g>
              );
            })}
          </svg>
        </div>
      </div>
      <div style={{ padding: "12px 24px", display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center" }}>
        <span style={{ fontSize: 12, lineHeight: "18px", color: P.color.sub, fontWeight: 600 }}>직군</span>
        {MORPH_FAMILIES.map(fm => (
          <span key={`lg-${fm.key}`} style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12, lineHeight: "18px", color: P.color.sub }}>
            <span style={{ width: 8, height: 8, borderRadius: 2, background: isoMix(fm.color, 70) }} />{fm.label}
          </span>
        ))}
        <span data-iso-hint style={{ fontSize: 12, lineHeight: "18px", color: hp ? P.color.strong : P.color.muted, fontWeight: hp ? 600 : 400 }}>
          {hp ? `${hp.name}${hp.title ? ` · ${hp.title}` : ""} · ${(teamOf(hp.teamId) || {}).name || ""} · 스쿼드 ${hpSquads.length}개${hpSquads.length ? ` (${hpSquads.map(s => s.name).join(", ")})` : ""}`
            : `· ★ = 조직장(팀 = 팀장 · 스쿼드 = 리드) · 이름표 둘째 줄 = 팀에서는 직함, 스쿼드에서는 주 소속 팀 · 여러 스쿼드면 블록이 나뉜다 · 점선 판 = 스쿼드 없음 · 끌어서 옮기기${overlay ? " · 끝나면 조직도로 넘어간다" : ""}`}
        </span>
      </div>
    </div>
  );
}

// ── 데모 조직 — 가상 100명 회사(MORPH_DEMO_100)를 조직 단위 트리로: 대표 → 본부(직군) → 팀 → 사람 ──
const DEMO_DIVS = { dev: ["개발본부", "본부"], design: ["디자인실", "실"], pm: ["프로덕트실", "실"], biz: ["비즈니스본부", "본부"], ops: ["경영지원실", "실"] };
const DEMO_ORG = (() => {
  const D = MORPH_DEMO_100, famColor = k => (MORPH_FAMILIES.find(f => f.key === k) || {}).color;
  const units = [];
  Object.entries(DEMO_DIVS).forEach(([fam, [name, label]]) => { if (D.teams.some(t => t.family === fam)) units.push({ id: `d-${fam}`, parentId: null, name, labelName: label, headId: null, teams: [] }); });
  D.teams.forEach(t => { const head = D.persons.find(p => p.teamId === t.id && p.head);
    units.push({ id: `u-${t.id}`, parentId: `d-${t.family}`, name: t.name, labelName: "팀", headId: head ? head.id : null, teams: [t.name] }); });
  const children = D.persons.map(p => ({ id: p.id, name: p.name, title: p.title, team: D.teams.find(t => t.id === p.teamId).name,
    avatar: p.name.slice(1, 3), color: famColor(p.family), status: "active" }));
  const root = { id: "ceo", isCeo: true, name: "한지민", title: "CEO", avatar: "지민", status: "active", children };
  return deriveOrgFromUnits(root, units);
})();

// 사람 카드 — §9-G 사람 카드 구성(아바타 · 이름 · 직함 · 조직장 배지)을 데모용으로 작게
function DemoPerson({ m }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, width: 200, boxSizing: "border-box", background: P.color.card, borderRadius: 12,
      padding: "10px 12px", boxShadow: ORG_CARD_SHADOW }}>
      <OrgAvatar node={m} size={32} />
      <div style={{ minWidth: 0, flex: 1 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ fontSize: 14, lineHeight: "20px", fontWeight: 600, color: P.color.strong, whiteSpace: "nowrap" }}>{m.name}</span>
          {m.isHead && <OrgBadge bg={P.color.infoText} title="이 조직의 조직장">조직장</OrgBadge>}
        </div>
        <div style={{ fontSize: 12, lineHeight: "18px", color: P.color.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.title}</div>
      </div>
    </div>
  );
}

// 평면 트리 조직도 — 본부 · 팀까지 펼치고 팀 안(사람)은 접어 둔다. 팀 카드 아래 숫자 배지를 누르면 펼친다 · 끌어서 옮기기 · 줌
// 평면 → 2.5D — 트리 카드를 등각 바닥과 같은 각도로 눕힌다(Z 45° 돌린 뒤 X 54.7° 눕힘 = 등각 투영 · 원근 없음)
const DEMO_TILT = "rotateX(54.7deg) rotateZ(45deg) scale(0.62)";
function DemoTree({ tilt = false, overlay = false, enterTilted = false }) {
  // 2.5D → 평면 — a: 평면·투명으로 먼저 그려 연결선을 잰다 → b: 전환 없이 눕힌다 → c: 일어서며 나타난다
  //   (연결선은 카드 위치를 재서 그리므로, 누운 채 처음 그리면 기울어진 위치로 잰다)
  const [rise, setRise] = useState(enterTilted ? "a" : null);
  useEffect(() => { if (!enterTilted) return; let r2;
    const r1 = requestAnimationFrame(() => { setRise("b"); r2 = requestAnimationFrame(() => requestAnimationFrame(() => setRise("c"))); });
    return () => { cancelAnimationFrame(r1); cancelAnimationFrame(r2); }; }, []);
  const lying = tilt || rise === "b";
  const still = rise === "a" || rise === "b";   // 이 두 단계는 전환 없이 바로
  const [collapsed, setCollapsed] = useState(() => new Set(DEMO_ORG.UNITS.filter(u => u.parentId).map(u => u.id)));
  const [zoom, setZoom] = useState(0.8);
  const box = useRef(null), drag = useRef(null);
  const toggle = id => setCollapsed(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  // 트리 안쪽은 접기 상태가 바뀔 때만 다시 그린다 — 눕고 일어서는 동안 연결선을 기울어진 위치로 다시 재지 않게
  const tree = useMemo(() => <OrgUnitTreeView derived={DEMO_ORG} renderPerson={m => <DemoPerson m={m} />} onOpenCard={() => {}} collapsed={collapsed} onToggle={toggle} company="데모 컴퍼니" />, [collapsed]);
  useEffect(() => { const el = box.current; if (el) el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2; }, []);
  const down = e => { if (e.target.closest("[data-card] [title]")) return; const el = box.current; drag.current = { x: e.clientX, y: e.clientY, sl: el.scrollLeft, st: el.scrollTop }; };
  const move = e => { const d = drag.current, el = box.current; if (!d) return; el.scrollLeft = d.sl - (e.clientX - d.x); el.scrollTop = d.st - (e.clientY - d.y); };
  const up = () => { drag.current = null; };
  const btn = { width: 36, height: 36, borderRadius: P.radius.md, border: "none", background: P.color.card, color: P.color.sub, cursor: "pointer", fontSize: 15, fontFamily: T.font, boxShadow: "rgba(10,13,18,.08) 0 4px 6px -1px" };
  return (
    <div data-demo-tree data-demo-tilt={lying ? "1" : "0"} style={{ position: overlay ? "absolute" : "relative", top: 0, left: 0, right: 0, zIndex: overlay ? 3 : "auto",
      background: P.color.card, borderRadius: 16, overflow: "hidden", pointerEvents: overlay || lying ? "none" : "auto",
      transform: lying ? DEMO_TILT : "none", transformOrigin: "50% 45%", opacity: overlay || still ? 0 : 1,
      boxShadow: lying ? "rgba(10,13,18,.18) 0 30px 60px -20px" : "none",
      transition: still ? "none" : "transform 750ms cubic-bezier(.45,0,.2,1), opacity 450ms ease, box-shadow 750ms" }}>
      <div style={{ position: "absolute", top: 17, right: 20, display: "flex", flexDirection: "column", gap: 8, zIndex: 2 }}>
        <button style={btn} title="확대" onClick={() => setZoom(z => Math.min(z + 0.1, 1.5))}>+</button>
        <button style={btn} title="축소" onClick={() => setZoom(z => Math.max(z - 0.1, 0.4))}>−</button>
        <button style={btn} title="모든 팀 펼치기" onClick={() => setCollapsed(new Set())}>⊞</button>
        <button style={btn} title="팀 안 접기" onClick={() => setCollapsed(new Set(DEMO_ORG.UNITS.filter(u => u.parentId).map(u => u.id)))}>⊟</button>
      </div>
      <div ref={box} onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
        style={{ overflow: "auto", height: 720, cursor: "grab", padding: "40px 0" }}>
        <div style={{ zoom, width: "max-content", minWidth: `${100 / zoom}%`, display: "flex", justifyContent: "center", padding: "0 80px", boxSizing: "border-box" }}>
          {tree}
        </div>
      </div>
      <div style={{ padding: "12px 24px", fontSize: 12, lineHeight: "18px", color: P.color.muted }}>
        팀 카드 아래 숫자를 누르면 그 팀 사람이 펼쳐집니다 · 끌어서 옮기기 · 맨 위 «스쿼드» 탭을 누르면 같은 사람들이 스쿼드로 다시 모입니다
      </div>
    </div>
  );
}

// 스쿼드 무대가 서서히 드러나게 — 마운트 직후 0 → 1
function FadeIn({ ms = 450, children }) {
  const [on, setOn] = useState(false);
  useEffect(() => { const r = requestAnimationFrame(() => requestAnimationFrame(() => setOn(true))); return () => cancelAnimationFrame(r); }, []);
  return <div style={{ opacity: on ? 1 : 0, transition: `opacity ${ms}ms ease` }}>{children}</div>;
}

// 장면 — tree(평면) · tilt(트리가 눕는다) · cross(누운 트리 위로 무대가 겹쳐 떠오른다) · squad(무대만) · back(역재생 덮개) · rise(누운 트리가 일어선다)
function Demo() {
  const [view, setView] = useState("org");
  const [phase, setPhase] = useState("tree");
  const [n, setN] = useState(0);
  const timers = useRef([]);
  const go = v => {
    if (v === view) return;
    timers.current.forEach(clearTimeout); timers.current = [];
    setView(v); setN(x => x + 1);
    if (v === "squad") { setPhase("tilt"); timers.current.push(setTimeout(() => setPhase("cross"), 700), setTimeout(() => setPhase("squad"), 1200)); }
    else setPhase("back");
  };
  const showTree = ["tree", "tilt", "cross", "rise"].includes(phase);
  const showStage = ["cross", "squad"].includes(phase);
  return (
    <div style={{ minHeight: "100vh", background: P.color.bg, fontFamily: T.font, padding: "32px 40px 40px" }}>
      <div style={{ maxWidth: 1240, margin: "0 auto" }}>
        <div style={{ display: "flex", gap: 20, height: 38, alignItems: "center" }}>
          {[["org", "조직도"], ["squad", "스쿼드"]].map(([v, label]) => (
            <span key={v} data-top-tab={v} onClick={() => go(v)} style={{ fontSize: P.type.title.fontSize, lineHeight: P.type.title.lineHeight,
              fontWeight: P.type.title.fontWeight, cursor: "pointer", color: view === v ? P.color.strong : P.color.disabled, transition: "color .15s" }}>{label}</span>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0 16px", fontSize: 14, lineHeight: "20px" }}>
          <span style={{ fontWeight: 700, color: P.color.sub }}>PIVIT 조직도 · 스쿼드 데모</span>
          <span style={{ color: P.color.disabled }}>·</span>
          <span style={{ color: P.color.muted, fontWeight: 600 }}>위 탭을 바꿔 보세요 — 기능 조직(팀)의 사람이 목적 조직(스쿼드)으로 다시 모입니다 · 가상 인물 100명 · 기획 시안이라 실제 서비스와 다를 수 있습니다</span>
        </div>
        <div style={{ position: "relative" }}>
          {showStage && <FadeIn key={`s${n}`}><SquadIsoStage to="squad" animate squads={[]} scaleMode="100" onScale={() => {}} onOpenCard={() => {}} /></FadeIn>}
          {phase === "back" && <SquadIsoStage key={`b${n}`} to="org" animate overlay squads={[]} scaleMode="100" onScale={() => {}} onDone={() => setPhase("rise")} onOpenCard={() => {}} />}
          {showTree && <DemoTree key={phase === "rise" ? `r${n}` : "tree"} tilt={phase === "tilt" || phase === "cross"} overlay={phase === "cross"} enterTilted={phase === "rise"} />}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);

</script>
</body>
</html>
