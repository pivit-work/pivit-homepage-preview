  });
  const faces = cubeFaces(chh), tall = cubeFaces(chh * 1.7);
  const famCount = list => MORPH_FAMILIES.map(f => ({ f, n: list.filter(m => (personOf(m.pid) || {}).family === f.key).length })).filter(x => x.n > 0);
  const CW = ISO.cardW, CH = ISO.cardH;
  const g0 = -40, gx1 = GW + 40, gy1 = GH + 40, step4 = cell * 4;
  const gridLines = [];
  for (let v = g0 + step4; v < gx1; v += step4) gridLines.push([[v, g0, 0], [v, gy1, 0]]);
  for (let v = g0 + step4; v < gy1; v += step4) gridLines.push([[g0, v, 0], [gx1, v, 0]]);
  const vbX = isoP(g0, gy1)[0] - 24, vbW = isoP(gx1, g0)[0] + 24 - vbX;
  const vbY = isoP(g0, g0)[1] - 80, vbH = isoP(gx1, gy1)[1] + 60 - vbY;
  useEffect(() => { const el = scroller.current; if (el) el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2; }, [zoom, scaleMode]);
  const onDown = e => { const el = scroller.current; if (!el) return; drag.current = { x: e.clientX, y: e.clientY, sl: el.scrollLeft, st: el.scrollTop, moved: false }; };
  const onMove = e => { const d = drag.current, el = scroller.current; if (!d || !el) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y; if (Math.abs(dx) + Math.abs(dy) > 4) d.moved = true;
    el.scrollLeft = d.sl - dx; el.scrollTop = d.st - dy; };
  const onUp = () => { setTimeout(() => { drag.current = null; }, 0); };
  const fit = () => { const el = scroller.current; if (el) setZoom(Math.min(1, Math.max(0.4, (el.clientWidth - 8) / vbW))); };
  const seg = (items, value) => (
    <div style={{ display: "flex", gap: 2, padding: 4, borderRadius: 8, background: P.color.hover }}>
      {items.map(v => { const active = v.key === value; return (
        <button key={v.key} data-iso-btn={v.key} onClick={v.on} style={{ height: 28, padding: "4px 8px", borderRadius: 6, cursor: "pointer",
          border: `1px solid ${active ? P.color.bgSection : "transparent"}`, background: active ? P.color.card : "transparent",
          boxShadow: active ? "rgba(10,13,18,.08) 0 4px 6px -1px" : "none", color: active ? P.color.sub : P.color.muted,
          fontSize: 14, lineHeight: "20px", fontWeight: 700, fontFamily: T.font }}>{v.label}</button>
      ); })}
    </div>
  );
  const hp = hov && personOf(hov);
  const hpSquads = hp ? data.squads.filter(sq => sq.members.some(m => m.pid === hov)) : [];
  const atSquad = phase === "done" ? to === "squad" : false;
  return (
    <div data-iso-stage={to} data-iso-phase={phase} style={{ background: P.color.card, borderRadius: 16, overflow: "hidden", opacity: leaving ? 0 : 1, transition: "opacity 400ms" }}>
      <div style={{ padding: "16px 24px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 14, lineHeight: "20px", fontWeight: 700, color: atSquad ? P.color.muted : P.color.strong, transition: "color 400ms" }}>팀(기능 조직) {data.teams.length}개 · {data.persons.length}명</span>
          <span style={{ fontSize: 14, color: P.color.muted }}>{to === "squad" ? "→" : "←"}</span>
          <span style={{ fontSize: 14, lineHeight: "20px", fontWeight: 700, color: atSquad || (phase === "play" && to === "squad") ? P.color.strong : P.color.muted, transition: "color 400ms" }}>스쿼드(목적 조직) {data.squads.length}개</span>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {phase === "play" && seg([{ key: "skip", label: "건너뛰기 ›", on: overlay ? onDone : finish }], null)}
        </div>
      </div>
      <div style={{ position: "relative", margin: "0 24px", borderRadius: 14, background: P.color.bg, overflow: "hidden" }}>
        <div style={{ position: "absolute", top: 12, right: 12, display: "flex", flexDirection: "column", gap: 8, zIndex: 2 }}>
          {[["+", () => setZoom(z => Math.min(z + 0.1, 1.5)), `확대 (현재 ${Math.round(zoom * 100)}%)`],
            ["−", () => setZoom(z => Math.max(z - 0.1, 0.4)), `축소 (현재 ${Math.round(zoom * 100)}%)`],
            ["⤢", fit, "한 화면에 맞추기"]].map(([lb, fn, tip]) => (
            <button key={lb} data-iso-zoom={lb} onClick={fn} title={tip} style={{ width: 36, height: 36, borderRadius: P.radius.md, border: "none",
              background: P.color.card, color: P.color.sub, cursor: "pointer", fontSize: 15, fontFamily: T.font, boxShadow: "rgba(10,13,18,.08) 0 4px 6px -1px" }}>{lb}</button>
          ))}
        </div>
        <div ref={scroller} data-iso-scroll onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
          style={{ overflow: "auto", maxHeight: 760, cursor: "grab" }}>
          <svg viewBox={`${vbX.toFixed(0)} ${vbY.toFixed(0)} ${vbW.toFixed(0)} ${vbH.toFixed(0)}`} width={Math.round(vbW * zoom)} height={Math.round(vbH * zoom)}
            style={{ display: "block", margin: "0 auto", overflow: "visible", userSelect: "none" }}>
            <polygon points={isoPts([[g0, gy1, 0], [gx1, gy1, 0], [gx1, gy1, -6], [g0, gy1, -6]])} style={{ fill: P.color.borderLight }} />
            <polygon points={isoPts([[gx1, gy1, 0], [gx1, g0, 0], [gx1, g0, -6], [gx1, gy1, -6]])} style={{ fill: P.color.border }} />
            <polygon points={isoPts([[g0, g0, 0], [gx1, g0, 0], [gx1, gy1, 0], [g0, gy1, 0]])} style={{ fill: P.color.bgSection }} />
            {gridLines.map((ln, i) => <polyline key={`gl${i}`} points={isoPts(ln)} style={{ fill: "none", stroke: P.color.borderLight, strokeWidth: 1 }} />)}
            {data.teams.map((tm, ti) => slab(TL.slabs[ti], `t-${tm.id}`, up === "org", famOf(tm.family).color, null))}
            {data.squads.map((sq, si) => slab(SL.slabs[si], `s-${sq.id}`, up === "squad", sq.color, famCount(sq.members)))}
            {none.length > 0 && slab(SL.slabs[data.squads.length], "s-none", up === "squad", null, null, true)}
            {data.teams.map((tm, ti) => { const hd = teamMembers[ti].map(m => personOf(m.pid)).find(p => p && p.head);
              return label(TL.slabs[ti], `t-${tm.id}`, up === "org", tm.name, "팀장", hd && hd.name, `${teamMembers[ti].length}명 · ${famOf(tm.family).label}`, isoMix(famOf(tm.family).color, 70)); })}
            {data.squads.map((sq, si) => { const ld = personOf((sq.members.find(m => m.lead) || {}).pid);
              return label(SL.slabs[si], `s-${sq.id}`, up === "squad", sq.name, "리드", ld && ld.name, `${sq.members.length}명 · ${famCount(sq.members).length}개 직군`, sq.color); })}
            {none.length > 0 && label(SL.slabs[data.squads.length], "s-none", up === "squad", "스쿼드 없음", null, null, `${none.length}명`, null)}
            {phase === "play" && drawn.map(tk => { const [gx, gy] = isoP(tk.A.x, tk.A.y, 0); return (
              <ellipse key={`sh-${tk.key}`} ref={el => { shadows.current[tk.key] = el; }} cx={0} cy={0} rx={cs * 0.8} ry={cs * 0.42} opacity={0}
                transform={`translate(${gx.toFixed(1)} ${gy.toFixed(1)})`} style={{ fill: "rgba(10,13,18,.14)" }} />
            ); })}
            {drawn.map(tk => {
              if (phase === "done" && to === "org" && tk.dup) return null;
              const at = phase === "done" ? tk.B : tk.A;
              const [sx, sy] = isoP(at.x, at.y, 0);
              const c = famOf(tk.p.family).color;
              const isHead = onSquadFloor ? tk.lead : tk.p.head;
              const f = isHead ? tall : faces, bh = isHead ? chh * 1.7 : chh;
              const dim = hov ? (tk.pid === hov ? 1 : 0.2) : (tk.none && onSquadFloor ? 0.5 : 1);
              const team = teamOf(tk.p.teamId);
              const role = isHead ? (onSquadFloor ? "리드" : "팀장") : "";
              const line2 = onSquadFloor ? (team ? team.name : "") : (tk.p.title || (team ? team.name : ""));
              const cy = -bh - h2 - 9 - CH;   // 이름표 윗변 — 블록 꼭대기 위 9px(꼭지 자리)
              return (
                <g key={tk.key} data-iso-cube={tk.key} ref={el => { nodes.current[tk.key] = el; }} transform={`translate(${sx.toFixed(1)} ${sy.toFixed(1)})`}
                  opacity={dim} onMouseEnter={() => phase === "done" && setHov(tk.pid)} onMouseLeave={() => setHov(null)}
                  onClick={() => { if (drag.current && drag.current.moved) return; tk.p.om && onOpenCard(tk.p.om); }}
                  style={{ cursor: tk.p.om ? "pointer" : "inherit", transition: "opacity 200ms" }}>
                  <title>{`${tk.p.name}${role ? ` · ${role}` : ""} · ${tk.p.title ? `${tk.p.title} · ` : ""}${team ? team.name : ""}${tk.none ? " · 스쿼드 없음" : ""}`}</title>
                  <polygon points={f.front} style={{ fill: isoMix(c, 55) }} />
                  <polygon points={f.side} style={{ fill: isoMix(c, 78) }} />
                  <polygon points={f.top} style={{ fill: isoMix(c, 24) }} />
                  <g data-iso-tag>
                    <path d={`M -6 ${cy + CH - 1} L 0 ${cy + CH + 7} L 6 ${cy + CH - 1} Z`} style={{ fill: P.color.card, stroke: hov === tk.pid ? P.color.borderBrand : P.color.borderLight, strokeWidth: 1 }} />
                    <rect x={-CW / 2} y={cy} width={CW} height={CH} rx={6} style={{ fill: P.color.card, stroke: hov === tk.pid ? P.color.borderBrand : P.color.borderLight, strokeWidth: 1 }} />
                    <rect x={-5} y={cy + CH - 2} width={10} height={3} style={{ fill: P.color.card }} />
                    <rect x={-CW / 2} y={cy} width={3} height={CH} rx={1.5} style={{ fill: isoMix(c, 70) }} />
                    <text x={-CW / 2 + 9} y={cy + 14} style={{ fontSize: 12, fontWeight: 700, fill: P.color.strong, fontFamily: T.font }}>
                      {isHead && <tspan style={{ fill: P.color.star }}>★</tspan>}{isoFit(tk.p.name, CW - (isHead ? 50 : 14), 12)}
                      {isHead && <tspan style={{ fontSize: 11, fontWeight: 600, fill: P.color.brandDeep }}>{` · ${role}`}</tspan>}
                    </text>
                    <text x={-CW / 2 + 9} y={cy + 28} style={{ fontSize: 11, fontWeight: 500, fill: P.color.sub, fontFamily: T.font }}>
                      {isoFit(line2, CW - 14, 11)}
                    </text>
                  </g>
                </g>
              );
            })}
          </svg>
        </div>
      </div>
      <div style={{ padding: "12px 24px", display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center" }}>
        <span style={{ fontSize: 12, lineHeight: "18px", color: P.color.sub, fontWeight: 600 }}>직군</span>
        {MORPH_FAMILIES.map(fm => (
          <span key={`lg-${fm.key}`} style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12, lineHeight: "18px", color: P.color.sub }}>
            <span style={{ width: 8, height: 8, borderRadius: 2, background: isoMix(fm.color, 70) }} />{fm.label}
          </span>
        ))}
        <span data-iso-hint style={{ fontSize: 12, lineHeight: "18px", color: hp ? P.color.strong : P.color.muted, fontWeight: hp ? 600 : 400 }}>
          {hp ? `${hp.name}${hp.title ? ` · ${hp.title}` : ""} · ${(teamOf(hp.teamId) || {}).name || ""} · 스쿼드 ${hpSquads.length}개${hpSquads.length ? ` (${hpSquads.map(s => s.name).join(", ")})` : ""}`
            : `· ★ = 조직장(팀 = 팀장 · 스쿼드 = 리드) · 이름표 둘째 줄 = 팀에서는 직함, 스쿼드에서는 주 소속 팀 · 여러 스쿼드면 블록이 나뉜다 · 점선 판 = 스쿼드 없음 · 끌어서 옮기기${overlay ? " · 끝나면 조직도로 넘어간다" : ""}`}
        </span>
      </div>
    </div>
  );
}

function Demo() {
  const [view, setView] = useState("org");
  const [n, setN] = useState(0);
  const go = v => { if (v === view) return; setView(v); setN(x => x + 1); };
  return (
    <div style={{ minHeight: "100vh", background: P.color.bg, fontFamily: T.font, padding: "32px 40px 40px" }}>
      <div style={{ maxWidth: 1240, margin: "0 auto" }}>
        <div style={{ display: "flex", gap: 20, height: 38, alignItems: "center" }}>
          {[["org", "조직도"], ["squad", "스쿼드"]].map(([v, label]) => (
            <span key={v} data-top-tab={v} onClick={() => go(v)} style={{ fontSize: P.type.title.fontSize, lineHeight: P.type.title.lineHeight,
              fontWeight: P.type.title.fontWeight, cursor: "pointer", color: view === v ? P.color.strong : P.color.disabled, transition: "color .15s" }}>{label}</span>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0 16px", fontSize: 14, lineHeight: "20px" }}>
          <span style={{ fontWeight: 700, color: P.color.sub }}>PIVIT 스쿼드 «한눈에» 데모</span>
          <span style={{ color: P.color.disabled }}>·</span>
          <span style={{ color: P.color.muted, fontWeight: 600 }}>위 탭을 바꿔 보세요 — 기능 조직(팀)의 사람이 목적 조직(스쿼드)으로 다시 모입니다 · 가상 인물 100명 · 기획 시안이라 실제 서비스와 다를 수 있습니다</span>
        </div>
        <SquadIsoStage key={n} to={view} animate={n > 0} squads={[]} scaleMode="100" onScale={() => {}} onOpenCard={() => {}} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);

</script>
</body>
</html>
