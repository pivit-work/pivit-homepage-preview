<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="민비서"><title>민비서</title>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f4f6;color:#2c3744;font:16px -apple-system,'Apple SD Gothic Neo',sans-serif;text-align:center;padding:16px;box-sizing:border-box}</style></head><body><p id="m">여는 중입니다</p>
<script>
(async()=>{const m=document.getElementById('m'),pw=decodeURIComponent(location.hash.slice(1));if(!pw){m.textContent='전달받은 링크로 다시 열어 주십시오.';return}
try{const b=new Uint8Array(await (await fetch('p.bin?t='+Date.now(),{cache:'no-store'})).arrayBuffer());const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:600000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28)));document.open();document.write(h);document.close();
}catch(_){m.textContent='링크가 맞지 않거나 연결이 끊겼습니다. 전달받은 링크로 다시 열어 주십시오.'}})();
</script></body></html>
